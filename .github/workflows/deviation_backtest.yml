name: Deviation Probability Backtest

on: 
  push:
    paths:
      - 'data/**'
      - 'deviation_backtest.py'
  workflow_dispatch: 

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install pandas numpy tabulate

      - name: Execute Backtest
        run: python deviation_backtest.py

      - name: Commit and Push Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 强制添加 data 文件夹下的所有 md 文件
          git add data/*.md
          # 只有在有变动时才提交，防止报错
          git commit -m "docs: 自动更新回测报告 [skip ci]" || echo "No changes to commit"
          git push
