name: Deviation Probability Backtest

on: 
  push:
    paths:
      - 'data/**'
      - 'deviation_backtest.py'
  workflow_dispatch: # 支持手动触发

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install pandas numpy tabulate

      - name: Execute Backtest
        run: python deviation_backtest.py

      - name: Save Report Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Deviation-Backtest-Result
          path: deviation_report.csv
