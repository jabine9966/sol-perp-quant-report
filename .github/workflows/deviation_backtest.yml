name: Deviation Probability Backtest

on: 
  push:
    paths:
      - 'data/**'
      - 'deviation_backtest.py'
  workflow_dispatch: 

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install pandas numpy tabulate

      - name: Execute Backtest
        run: python deviation_backtest.py

      - name: Commit and Push Summary Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main --rebase
          # 仅添加汇总报告文件
          git add data/multi_timeframe_report.md
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: 更新全周期汇总报告 [skip ci]"
            git push origin main
          fi
